<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trial Eligibility Compiler</title>
<meta name="description" content="Compile clinical trial eligibility criteria
into executable predicates and match a patient against 500 recruiting NSCLC
trials. Deterministic, cites its sources, answers with a date.">
<meta name="robots" content="index,follow">
<link rel="canonical" href="https://trial-eligibility-compiler.vercel.app/">
<meta property="og:type" content="website">
<meta property="og:title" content="Trial Eligibility Compiler">
<meta property="og:description" content="Match a patient against 500 recruiting
NSCLC trials. Every verdict is deterministic and cites the sentence it came from.">
<meta property="og:url" content="https://trial-eligibility-compiler.vercel.app/">
<meta name="twitter:card" content="summary">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="progress" class="bar"></div>

<header class="hdr">
  <button class="back" id="back" hidden aria-label="Back to the document"
          title="Back to the document (Esc)">
    <span aria-hidden="true">←</span><span class="lbl">New&nbsp;patient</span>
  </button>
  <div class="brand">
    <div class="logo">T</div>
    <div class="name">Eligibility&nbsp;Compiler</div>
  </div>
  <span class="crumb" id="crumb" hidden></span>
  <div class="grow"></div>
  <div class="perf" id="perf" hidden></div>
  <button class="kbd" id="palette-open" title="Search trials">
    <kbd>⌘K</kbd><span>Search</span>
  </button>
</header>

<!-- ── input ────────────────────────────────────────────────────────── -->
<section class="intake" id="intake">
  <div class="intake-inner">
    <h1>Match a patient against 500 recruiting NSCLC trials.</h1>

    <div class="choose" id="choose">
      <div class="drop" id="drop" tabindex="0" role="button"
           aria-label="Upload an oncology note">
        <svg class="drop-ico" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M6 2.75h7.5L19 8.25v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V3.75a1 1 0 0 1 1-1Z"
                stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
          <path d="M13.25 2.9v5.4h5.4M8.5 13h7M8.5 16.5h7M8.5 9.5h2.5"
                stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
        </svg>
        <div class="drop-main">
          <b>Drop an oncology note</b>
          <span>or <u>browse</u> · plain text, up to 200&nbsp;KB</span>
        </div>
        <input type="file" id="file" accept=".txt,.text,.md,.markdown,.csv,.json,text/*" hidden>
      </div>

      <button class="sample-link" id="use-sample">
        Use the test document <span aria-hidden="true">→</span>
      </button>
    </div>

    <div class="loaded" id="loaded" hidden>
      <div class="paper">
        <div class="paper-hd">
          <span id="paper-title">Document</span>
          <span class="grow"></span>
          <span class="paper-hint" id="intake-hint"></span>
          <button class="paper-x" id="clear-doc">Replace</button>
        </div>
        <textarea id="report" spellcheck="false"
          placeholder="Paste an oncology note or NGS report…"></textarea>
      </div>

      <div class="intake-act">
        <button class="btn primary" id="run">
          Match 500 trials <kbd class="on-dark">⌘⏎</kbd>
        </button>
      </div>
    </div>
  </div>
</section>

<!-- ── results ──────────────────────────────────────────────────────── -->
<section class="strip" id="strip" hidden>
  <div class="strip-top">
    <div class="hero" id="hero"></div>
    <div class="proof" id="proof"></div>
  </div>
  <div class="counts" id="counts"></div>
  <div class="work" id="work"></div>
  <div class="patient" id="patient"></div>
  <!-- Asked once, a while after the first match, and only ever answered by
       choice. Anonymous traffic cannot distinguish an engineer reading about
       the compiler from a coordinator who would use it, and that is the only
       distinction worth knowing. -->
  <div class="who" id="who" hidden>
    <span class="who-q">Who did this reach?</span>
    <div class="who-opts">
      <button type="button" data-role="screens_patients">I screen patients for trials</button>
      <button type="button" data-role="clinician">Clinician</button>
      <button type="button" data-role="researcher">Researcher</button>
      <button type="button" data-role="engineer">Engineer</button>
      <button type="button" data-role="curious">Just curious</button>
    </div>
    <button type="button" class="who-x" id="who-x" aria-label="Dismiss">&times;</button>
  </div>
</section>

<div class="split" id="split" hidden>
  <div class="col-list">
    <div class="filterbar" id="filterbar" hidden>
      <button class="backlink" id="clear-filter">
        <span aria-hidden="true">←</span> All trials
      </button>
      <span class="filterbar-what" id="filter-what"></span>
    </div>
    <div class="list" id="list" tabindex="-1"></div>
  </div>
  <div class="detail" id="detail"></div>
</div>

<!-- ── command palette ──────────────────────────────────────────────── -->
<div class="palette-wrap" id="palette" hidden>
  <div class="palette" role="dialog" aria-label="Search trials">
    <div class="palette-in">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <circle cx="7" cy="7" r="4.6" stroke="currentColor" stroke-width="1.5"/>
        <path d="M10.6 10.6 14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <input id="palette-q" type="text" autocomplete="off" spellcheck="false"
             placeholder="Search trials, sites, reasons…">
    </div>
    <div class="palette-results" id="palette-results"></div>
    <div class="palette-foot">
      <span><kbd>↑</kbd><kbd>↓</kbd></span><span><kbd>↵</kbd> open</span>
      <span><kbd>esc</kbd> close</span>
    </div>
  </div>
</div>

<footer class="sitefoot">
  <a href="/about.html">How it works</a>
  <a href="/privacy.html">Privacy</a>
  <a href="/terms.html">Terms</a>
  <a href="https://github.com/science182/trial-eligibility-compiler" target="_blank" rel="noopener noreferrer">Source</a>
  <span class="sitefoot-note">Not medical advice · not for patients ·
    de-identified or test notes only</span>
</footer>

<script src="app.js"></script>
</body>
</html>
